<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nullscape Calculator</title>
    <link rel="icon" type="image/png" href="assets/Paycheck.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="prices.css">
</head>
<body class="mode-standard">

<div class="mobile-settings-overlay" id="mobileDrawer">
    <div class="drawer-head">
        <span class="label">Settings</span>
        <button class="drawer-close" onclick="toggleMobileSettings()" aria-label="Close settings">✕</button>
    </div>
    <div id="mobile-settings-content"></div>
</div>

<div id="loading-screen">
    <div class="loader-ring"></div>
</div>

<div class="container" id="main-ui">
    <header>
        <a href="index.html" class="back-btn">← Home</a>
        <h1>Nullscape Calculator</h1>
    </header>

    <div class="main-layout">

        <div class="card">
            <div class="section-title">Upgrades</div>
            <div class="upgrades-grid" id="mainGrid"></div>
        </div>

        <div class="sticky-sidebar">
            <div class="card" id="pc-settings-box">
                <div class="section-title">Settings</div>
                <div class="settings-grid">

                    <div class="input-group">
                        <label>Difficulty</label>
                        <div class="mode-selector cols-3">
                            <div class="mode-btn" data-diff="casual" onclick="setDifficulty('casual')">Casual</div>
                            <div class="mode-btn active" data-diff="standard" onclick="setDifficulty('standard')">Standard</div>
                            <div class="mode-btn" data-diff="extreme" onclick="setDifficulty('extreme')">Extreme</div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Mode</label>
                        <div class="mode-selector cols-2">
                            <div class="mode-btn active" data-mode="solo" onclick="setMode('solo')">Solo</div>
                            <div class="mode-btn" data-mode="duo" onclick="setMode('duo')">Duo</div>
                            <div class="mode-btn" data-mode="party" onclick="setMode('party')">Party</div>
                            <div class="mode-btn" data-mode="partyplus" onclick="setMode('partyplus')">Party+</div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Player Count</label>
                        <input type="number" class="player-input" id="pInput" min="1" max="1" value="1" onchange="validatePlayers(this)">
                    </div>

                    <div class="input-group">
                        <label>Discounts</label>
                        <button class="curse-toggle-btn" id="curseBtnPC" onclick="toggleCurse()">
                            <span>Nothing Curse</span>
                            <span class="curse-pill">–15% off</span>
                        </button>
                    </div>

                </div>
            </div>

            <div class="card total-card">
                <span class="label">Total gift</span>
                <div id="curse-indicator">Discount is on</div>
                <div class="total-val" id="result">0</div>
                <div class="formula-text" id="formulaText">ceil(base × √players)</div>
                <button class="reset-all-btn" onclick="clearAll()">Reset all</button>
            </div>
        </div>

    </div>
</div>

<div class="mobile-bottom-nav">
    <div class="mobile-total-wrap">
        <span class="label">Total</span>
        <span class="price" id="mobile-result">0</span>
    </div>
    <div class="mobile-actions">
        <button class="mobile-reset" onclick="clearAll()" aria-label="Reset all">↺</button>
        <button class="mobile-settings-btn" id="mobileSettingsBtn" onclick="toggleMobileSettings()">Settings</button>
    </div>
</div>

<script src="prices.js"></script>
</body>
</html>
